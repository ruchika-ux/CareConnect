spring.application.name=careconnect
server.port=${PORT:8080}
server.error.include-message=always

# Falls back to in-memory H2 when DB_URL is not provided (local quick start).
spring.datasource.url=${DB_URL:jdbc:h2:mem:careconnect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# 'update' keeps data between restarts. Use DDL_AUTO=validate with real migrations for production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=${H2_CONSOLE:false}

app.jwt.secret=${JWT_SECRET:change-me-use-32-char-minimum-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Demo accounts (password "demo"). Turn off outside local development.
app.seed.demo=${SEED_DEMO:true}
app.admin.email=${ADMIN_EMAIL:admin@careconnect.test}
app.admin.password=${ADMIN_PASSWORD:}
